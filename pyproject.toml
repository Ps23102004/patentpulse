[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patentpulse"
version = "0.1.0"
description = "Point it at a product idea, get back a prior-art landscape scan of real recent US patents. Informational only, not legal advice."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests",
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
patentpulse = "patentpulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["patentpulse"]
artifacts = ["patentpulse/fixtures/*.json"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "web"

[tool.hatch.build.targets.sdist]
include = [
    "patentpulse/*",
    "web/*",
]

[tool.pytest.ini_options]
markers = ["network: hits a live external API"]
pythonpath = ["."]
